# Cloudflare Pages deployment (https://api-ground.pages.dev). Build with: npm run deploy:pages
name = "api-ground"
pages_build_output_dir = "dist"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "api-playground"
database_id = "87dd6865-652a-452b-a094-888e6f479e66"

[vars]
APP_NAME = "API-Ground"
# Windows 설치 파일 공개 다운로드 주소 (GitHub 공개 릴리스). 로그인한 사용자를 이 주소로 보냅니다.
DOWNLOAD_URL = "https://github.com/api-ground/api-ground/releases/download/v1.1.0/API-Ground-Setup-1.1.0.exe"
